<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration Form</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>Student Registration Form</h1>
<form id="regForm" action="#" method="post" enctype="multipart/form-data" autocomplete="on">

<fieldset>
<legend>Personal Information</legend>
<label for="fname">Full name</label>
<input type="text" id="fname" name="fname" placeholder="Enter full name" required minlength="3" maxlength="50" autofocus>

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="name@example.com" required>

<label for="pwd">Password</label>
<input type="password" id="pwd" name="pwd" minlength="8" required>

<label for="phone">Phone</label>
<input type="tel" id="phone" name="phone" pattern="[0-9+\-\s]{10,15}" placeholder="+92 300 1234567">

<label for="web">Personal website</label>
<input type="url" id="web" name="web" placeholder="https://">

<label for="dob">Date of birth</label>
<input type="date" id="dob" name="dob" required>

<label for="age">Age (number)</label>
<input type="number" id="age" name="age" min="5" max="60" step="1">

<label for="search">Search school/college</label>
<input type="search" id="search" name="search" list="colleges">
<datalist id="colleges">
<option value="Karachi University">
<option value="NED University">
<option value="IBA Karachi">
<option value="FAST NUCES">
</datalist>

<span class="label">Gender</span>
<div class="row">
<label><input type="radio" name="gender" value="male" required> Male</label>
<label><input type="radio" name="gender" value="female"> Female</label>
<label><input type="radio" name="gender" value="other"> Other</label>
</div>

<label for="photo">Profile photo</label>
<input type="file" id="photo" name="photo" accept="image/*">

<label for="docs">Documents (multiple)</label>
<input type="file" id="docs" name="docs" multiple accept=".pdf,.doc,.docx">
</fieldset>

<fieldset>
<legend>Academic Information</legend>
<label for="program">Program</label>
<select id="program" name="program" required>
<option value="">-- Select --</option>
<optgroup label="Computing">
<option>BS Computer Science</option>
<option>BS Software Engineering</option>
</optgroup>
<optgroup label="Business">
<option>BBA</option>
<option>B.Com</option>
</optgroup>
</select>

<label for="subjects">Subjects (hold Ctrl for multiple)</label>
<select id="subjects" name="subjects" multiple size="4">
<option>Mathematics</option>
<option>Physics</option>
<option>English</option>
<option>Programming</option>
</select>

<span class="label">Interests</span>
<div class="row">
<label><input type="checkbox" name="interest" value="sports"> Sports</label>
<label><input type="checkbox" name="interest" value="music"> Music</label>
<label><input type="checkbox" name="interest" value="coding"> Coding</label>
<label><input type="checkbox" name="interest" value="reading"> Reading</label>
</div>

<label for="gpa">Previous marks (%): <output id="gpaOut">50</output></label>
<input type="range" id="gpa" name="gpa" min="0" max="100" value="50">

<label for="intake">Intake month</label>
<input type="month" id="intake" name="intake">

<label for="week">Intake week</label>
<input type="week" id="week" name="week">

<label for="time">Preferred class time</label>
<input type="time" id="time" name="time">

<label for="dt">Admission test slot</label>
<input type="datetime-local" id="dt" name="dt">

<label for="color">Favourite colour</label>
<input type="color" id="color" name="color" value="#2a6f6b">

<label for="progress">Form completion</label>
<progress id="progress" value="0" max="100">0%</progress>

<label for="meter">Fee paid</label>
<meter id="meter" min="0" max="100" low="30" high="70" optimum="100" value="60">60%</meter>
</fieldset>

<fieldset>
<legend>Address &amp; Other</legend>
<label for="address">Address</label>
<textarea id="address" name="address" rows="3" cols="40" maxlength="200" placeholder="Home address"></textarea>

<label for="about">About yourself</label>
<textarea id="about" name="about" rows="4" placeholder="Short introduction"></textarea>

<input type="hidden" name="form_id" value="STU-REG-001">

<label class="check"><input type="checkbox" id="agree" name="agree" required> I confirm the above information is correct.</label>
</fieldset>

<div class="row buttons">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
<input type="button" id="alertBtn" value="Show Summary">
<button type="submit">Register</button>
<button type="button" id="clearBtn">Clear Form</button>
</div>
</form>
<p id="result" role="status"></p>
</main>
<script src="js/script.js"></script>
</body>
  </html>
